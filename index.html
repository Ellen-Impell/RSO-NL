<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSO-regiokaart Nederland</title>
<meta name="description" content="Interactieve kaart van de Nederlandse zorgregio's, gekleurd naar hun relatie tot RSO Nederland.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
html{color-scheme:light dark}
:root{
  --ground:#F2F4F6; --panel:#FFFFFF; --sea:#E4EAEF;
  --ink:#151C24; --ink-2:#4A5A68; --ink-3:#7E8D9A;
  --line:#D5DDE4; --line-2:#E8EDF1;
  --lid:#CE2247; --lid-line:#9B0F30; --lid-soft:#FBE7EC;
  --samenw:#F2A7BE; --samenw-line:#CE6C8B; --samenw-soft:#FDEFF4;
  --overig:#9CC6E6; --overig-line:#4E86B4; --overig-soft:#EAF2F9;
  --accent:#1F4E6B; --warn:#8A5A00; --warn-bg:#FDF3DC; --warn-line:#E6C77A;
  --shadow:0 1px 2px rgba(21,28,36,.06), 0 6px 20px rgba(21,28,36,.07);
  --r:10px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#10161C; --panel:#18212A; --sea:#141D25;
  --ink:#E7EDF2; --ink-2:#A6B5C2; --ink-3:#74838F;
  --line:#2A363F; --line-2:#222C35;
  --lid:#D93B5C; --lid-line:#F0798F; --lid-soft:#331821;
  --samenw:#D98BA6; --samenw-line:#EBB0C4; --samenw-soft:#2E1E25;
  --overig:#6FA6CD; --overig-line:#9FC9E5; --overig-soft:#16242E;
  --accent:#8FC0DE; --warn:#E8C67E; --warn-bg:#2B2413; --warn-line:#5E4E24;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#10161C; --panel:#18212A; --sea:#141D25;
  --ink:#E7EDF2; --ink-2:#A6B5C2; --ink-3:#74838F;
  --line:#2A363F; --line-2:#222C35;
  --lid:#D93B5C; --lid-line:#F0798F; --lid-soft:#331821;
  --samenw:#D98BA6; --samenw-line:#EBB0C4; --samenw-soft:#2E1E25;
  --overig:#6FA6CD; --overig-line:#9FC9E5; --overig-soft:#16242E;
  --accent:#8FC0DE; --warn:#E8C67E; --warn-bg:#2B2413; --warn-line:#5E4E24;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;
  display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
h1{margin:0;font-size:clamp(25px,4.6vw,36px);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0;max-width:62ch;font-family:"Source Serif 4",Georgia,serif;font-size:16.5px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:9px;padding:9px 16px 9px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
  font:inherit;font-size:16px;transition:border-color .15s,opacity .15s}
.chip:hover{border-color:var(--ink-3)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="false"]{opacity:.42}
.sw{width:17px;height:17px;border-radius:4px;flex:none}
.chip .n{color:var(--ink-3);font-variant-numeric:tabular-nums}
.sw.lid{background:var(--lid);border:1.5px solid var(--lid-line)}
.sw.samenw{background:var(--samenw);border:1.5px solid var(--samenw-line)}
.sw.overig{background:var(--overig);border:1.5px solid var(--overig-line)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.stats{grid-template-columns:1fr}}
.stat{background:var(--panel);border:1px solid var(--line);border-left-width:4px;
  border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.stat.lid{border-left-color:var(--lid)}
.stat.samenw{border-left-color:var(--samenw)}
.stat.overig{border-left-color:var(--overig)}
.stat .pct{font-size:27px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  line-height:1.15}
.stat .cap{font-size:12.5px;color:var(--ink-2)}
.stat .sub{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:3px}
.alert{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);
  border-radius:var(--r);padding:12px 15px;font-size:13.5px}
.alert b{display:block;margin-bottom:3px}
.grid{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.mapcard{background:var(--sea);border:1px solid var(--line);border-radius:var(--r);
  padding:10px;position:relative;box-shadow:var(--shadow)}
svg{display:block;width:100%;height:auto;max-width:100%}
path.regio{stroke-linejoin:round;cursor:pointer;transition:opacity .15s,filter .15s}
path.lid{fill:var(--lid);stroke:var(--lid-line);stroke-width:2.2}
path.samenw{fill:var(--samenw);stroke:var(--samenw-line);stroke-width:2.2}
path.overig{fill:var(--overig);stroke:var(--overig-line);stroke-width:2.2}
path.regio.dim{opacity:.16}
path.regio.on{stroke-width:4.5;filter:brightness(1.07)}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:8px 11px;box-shadow:var(--shadow);
  font-size:13px;line-height:1.35;max-width:230px;transform:translate(-50%,-115%);opacity:0;
  transition:opacity .12s}
.tip.show{opacity:1}
.tip b{display:block;font-weight:600;font-size:13.5px}
.tip span{color:var(--ink-2)}
aside{display:flex;flex-direction:column;gap:14px}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 17px;box-shadow:var(--shadow)}
.detail h2{margin:0 0 3px;font-size:19px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  padding:4px 10px;border-radius:999px;margin-bottom:12px}
.status.lid{background:var(--lid-soft);color:var(--lid-line)}
.status.samenw{background:var(--samenw-soft);color:var(--samenw-line)}
.status.overig{background:var(--overig-soft);color:var(--overig-line)}
.facts{display:flex;gap:26px;margin:0 0 12px;padding:0;list-style:none}
.facts div{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.facts strong{display:block;font-size:21px;font-weight:600;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.gemlist{margin:0;padding-top:12px;border-top:1px solid var(--line-2);
  font-size:13.5px;color:var(--ink-2);max-height:190px;overflow-y:auto;line-height:1.65}
.hint{color:var(--ink-3);font-size:13.5px;margin:0}
.tablecard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.tablecard h3{margin:0;padding:13px 17px;font-size:12px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line-2)}
.scroller{max-height:330px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 17px;border-bottom:1px solid var(--line-2)}
th{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  position:sticky;top:0;background:var(--panel)}
td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--ground)}
tr.row.on td{background:var(--ground);font-weight:600}
tr.row.hide{display:none}
.bar{display:inline-block;width:4px;height:13px;border-radius:2px;margin-right:9px;vertical-align:-2px}
.bar.lid{background:var(--lid)}.bar.samenw{background:var(--samenw)}.bar.overig{background:var(--overig)}
footer{color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Bezig met laden&hellip;</div>
    <h1>Regionale samenwerkingsverbanden in de zorg</h1>
    <p class="lede">De regio&rsquo;s van Nederland, gekleurd naar hun relatie tot RSO Nederland.
      Klik een regio voor de gemeenten die eronder vallen.</p>
    <div class="legend" id="legend"></div>
  </header>

  <div class="stats" id="stats"></div>
  <div id="alerts"></div>

  <div class="grid">
    <div class="mapcard">
      <svg id="map" role="img" aria-label="Kaart van Nederland met de zorgregio&rsquo;s"></svg>
      <div class="tip" id="tip" aria-hidden="true"></div>
    </div>

    <aside>
      <div class="detail" id="detail"></div>
      <div class="tablecard">
        <h3>Alle regio&rsquo;s</h3>
        <div class="scroller">
          <table>
            <thead><tr><th>Regio</th><th class="num">Gem.</th><th class="num">Inwoners</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </aside>
  </div>

  <footer id="footer"></footer>
</div>

<script>
/* ======================================================================
   INSTELLINGEN — pas hier aan als je kolomnamen of statuswaarden wijzigen
   ====================================================================== */
const CONFIG = {
  csv:     "gemeenten.csv",      // databestand in deze repo
  geojson: "regios.geojson",     // regiogrenzen (verandert zelden)
  kolom: {                        // kolomkoppen in de CSV
    gemeente:  "Gemeente",
    regio:     "RSO",
    status:    "RSO NL lid",
    inwoners:  "inw-2025"
  },
  // welke statuswaarde hoort bij welke kleur; alles wat hier niet staat wordt "overig"
  categorie: {
    "Lid":          "lid",
    "Aspirant-lid": "lid",
    "Samenwerking": "samenw"
  }
};
/* ====================== einde instellingen ============================ */

const LABEL = {lid:"Lid van RSO NL", samenw:"Samenwerking met een RSO", overig:"Overige regio’s"};
const ORDER = ["lid","samenw","overig"];
const NS = "http://www.w3.org/2000/svg";
const nf = new Intl.NumberFormat("nl-NL");
const pf = new Intl.NumberFormat("nl-NL",{minimumFractionDigits:1,maximumFractionDigits:1});

const svg = document.getElementById("map"), tip = document.getElementById("tip");
const detail = document.getElementById("detail"), tbody = document.getElementById("tbody");
const active = new Set(ORDER);
let REGIOS = [], TOTAAL = 0, sel = null;

/* ---------- CSV-parser die aanhalingstekens en komma's in namen aankan ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], val = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ val += '"'; i++; } else q = false; }
      else val += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(val); val = ""; }
    else if (c === "\n"){ row.push(val); rows.push(row); row = []; val = ""; }
    else if (c !== "\r") val += c;
  }
  if (val.length || row.length){ row.push(val); rows.push(row); }
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.some(v => v.trim() !== ""))
             .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])));
}

/* ---------- naamnormalisatie: 'RSO Noord-Oost Brabant i.o.' == 'RSO Noord-Oost Brabant' ---------- */
function slug(s){
  return String(s).normalize("NFC").replace(/’/g, "'").replace(/ /g, " ")
    .toLowerCase()
    .replace(/\bi\.o\.?\b/g, "")
    .replace(/^\s*(rso|vereniging)\s+/, "")
    .replace(/^\s*samen gezond\s+/, "")
    .replace(/[^a-z0-9]/g, "");
}
const num = v => Number(String(v).replace(/[^0-9-]/g, "")) || 0;

/* ---------- data laden en samenvoegen ---------- */
Promise.all([
  fetch(CONFIG.geojson).then(r => { if(!r.ok) throw new Error(CONFIG.geojson); return r.json(); }),
  fetch(CONFIG.csv).then(r => { if(!r.ok) throw new Error(CONFIG.csv); return r.text(); })
]).then(([geo, csv]) => build(geo, parseCSV(csv)))
  .catch(err => {
    document.getElementById("alerts").innerHTML =
      `<div class="alert"><b>Kan de gegevens niet laden</b>${err.message} is niet gevonden.
       Open deze pagina via een webserver (bijvoorbeeld GitHub Pages), niet rechtstreeks vanaf je schijf.</div>`;
    document.getElementById("eyebrow").textContent = "Laden mislukt";
  });

function build(geo, rijen){
  const K = CONFIG.kolom;
  const perRegio = new Map();
  rijen.forEach(rij => {
    const naam = rij[K.regio];
    if (!naam) return;
    const k = slug(naam);
    if (!perRegio.has(k)) perRegio.set(k, {naam, status:rij[K.status] || "", gem:[], inw:0});
    const r = perRegio.get(k);
    r.gem.push(rij[K.gemeente]);
    r.inw += num(rij[K.inwoners]);
    if (!r.status) r.status = rij[K.status] || "";
  });

  /* projectie: equirectangulair, schaal op de breedtegraad van Nederland */
  const KX = Math.cos(52.1 * Math.PI / 180);
  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  geo.features.forEach(f => f.geometry.coordinates[0].forEach(([lo, la]) => {
    const x = lo * KX, y = -la;
    if (x < minx) minx = x; if (x > maxx) maxx = x;
    if (y < miny) miny = y; if (y > maxy) maxy = y;
  }));
  const pad = 0.035; minx -= pad; maxx += pad; miny -= pad; maxy += pad;
  const W = 1000, S = W / (maxx - minx), H = (maxy - miny) * S;
  svg.setAttribute("viewBox", `0 0 ${W} ${H.toFixed(1)}`);
  const toPath = ring => ring.map(([lo, la], i) =>
    (i ? "L" : "M") + ((lo * KX - minx) * S).toFixed(1) + " " + ((-la - miny) * S).toFixed(1)).join("") + "Z";

  const zonderData = [];
  REGIOS = geo.features.map(f => {
    const k = slug(f.properties.naam), d = perRegio.get(k);
    if (d) perRegio.delete(k); else zonderData.push(f.properties.naam);
    const status = d ? d.status : "";
    return {
      naam: d ? d.naam : f.properties.naam,
      kaartnaam: f.properties.naam,
      status: status || "Geen status",
      cat: CONFIG.categorie[status] || "overig",
      ngem: d ? d.gem.length : 0,
      inw: d ? d.inw : 0,
      gem: d ? d.gem.slice().sort((a, b) => a.localeCompare(b, "nl")) : [],
      d: toPath(f.geometry.coordinates[0])
    };
  }).sort((a, b) => ORDER.indexOf(b.cat) - ORDER.indexOf(a.cat));

  const zonderVorm = [...perRegio.values()].map(r => r.naam);
  TOTAAL = REGIOS.reduce((a, r) => a + r.inw, 0);

  REGIOS.forEach((r, i) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", r.d);
    p.setAttribute("class", "regio " + r.cat);
    p.setAttribute("tabindex", "0");
    p.setAttribute("role", "button");
    p.setAttribute("aria-label", r.naam + ", " + LABEL[r.cat]);
    p.dataset.i = i;
    svg.appendChild(p);
    r.el = p;
  });

  const totGem = REGIOS.reduce((a, r) => a + r.ngem, 0);
  document.getElementById("eyebrow").textContent =
    `${totGem} gemeenten · ${REGIOS.length} regio’s · ${nf.format(TOTAAL)} inwoners`;
  document.getElementById("footer").innerHTML =
    "Regiogrenzen uit <code>" + CONFIG.geojson + "</code>, status en inwonertallen uit <code>" +
    CONFIG.csv + "</code>. Aspirant-leden tellen mee als lid van RSO&nbsp;Nederland.";

  /* legenda */
  const perCat = ORDER.map(c => {
    const rs = REGIOS.filter(r => r.cat === c);
    return {cat:c, regios:rs.length, gem:rs.reduce((a,r)=>a+r.ngem,0), inw:rs.reduce((a,r)=>a+r.inw,0)};
  });
  document.getElementById("legend").innerHTML = perCat.map(c =>
    `<button class="chip" type="button" aria-pressed="true" data-cat="${c.cat}">
       <span class="sw ${c.cat}"></span>${LABEL[c.cat]}
       <span class="n">(${c.regios} regio&rsquo;s)</span>
     </button>`).join("");

  /* kerncijfers */
  document.getElementById("stats").innerHTML = perCat.map(c =>
    `<div class="stat ${c.cat}">
       <div class="pct">${pf.format(TOTAAL ? c.inw / TOTAAL * 100 : 0)}%</div>
       <div class="cap">van de inwoners — ${LABEL[c.cat]}</div>
       <div class="sub">${nf.format(c.inw)} inwoners in ${c.gem} gemeenten</div>
     </div>`).join("");

  /* waarschuwingen bij niet-gekoppelde namen */
  const al = [];
  if (zonderVorm.length) al.push(`<div class="alert"><b>${zonderVorm.length} RSO-naam(en) uit de CSV staan niet op de kaart</b>
    ${zonderVorm.join(", ")} &mdash; controleer de schrijfwijze of voeg de regio toe aan ${CONFIG.geojson}.</div>`);
  if (zonderData.length) al.push(`<div class="alert"><b>${zonderData.length} regio(&rsquo;s) op de kaart zonder gegevens</b>
    ${zonderData.join(", ")} &mdash; deze komen niet voor in de kolom &lsquo;${K.regio}&rsquo; van de CSV.</div>`);
  document.getElementById("alerts").innerHTML = al.join("");

  /* tabel */
  tbody.innerHTML = REGIOS.map((r, i) => ({r, i}))
    .sort((a, b) => ORDER.indexOf(a.r.cat) - ORDER.indexOf(b.r.cat) || b.r.inw - a.r.inw)
    .map(({r, i}) => `<tr class="row" data-i="${i}">
        <td><span class="bar ${r.cat}"></span>${r.naam}</td>
        <td class="num">${r.ngem}</td><td class="num">${nf.format(r.inw)}</td></tr>`).join("");

  sel = REGIOS.reduce((b, r, i) => r.inw > REGIOS[b].inw ? i : b, 0);
  show(sel); mark(sel); applyFilter();
}

function show(i){
  const r = REGIOS[i];
  detail.innerHTML = `<h2>${r.naam}</h2>
    <span class="status ${r.cat}">${r.status}</span>
    <ul class="facts"><li><div>Gemeenten</div><strong>${r.ngem}</strong></li>
    <li><div>Inwoners</div><strong>${nf.format(r.inw)}</strong></li></ul>
    <p class="gemlist">${r.gem.length ? r.gem.join(" &middot; ") : "Geen gemeenten gevonden in de CSV."}</p>`;
}
function mark(i){
  REGIOS.forEach((r, j) => r.el.classList.toggle("on", j === i));
  tbody.querySelectorAll("tr").forEach(tr => tr.classList.toggle("on", +tr.dataset.i === i));
}
function applyFilter(){
  REGIOS.forEach(r => r.el.classList.toggle("dim", !active.has(r.cat)));
  tbody.querySelectorAll("tr").forEach(tr =>
    tr.classList.toggle("hide", !active.has(REGIOS[+tr.dataset.i].cat)));
}

svg.addEventListener("pointermove", e => {
  const p = e.target.closest("path.regio");
  if (!p || p.classList.contains("dim")){ tip.classList.remove("show"); return; }
  const r = REGIOS[+p.dataset.i], b = svg.parentElement.getBoundingClientRect();
  tip.innerHTML = `<b>${r.naam}</b><span>${r.status} &middot; ${r.ngem} gemeenten</span>`;
  tip.style.left = (e.clientX - b.left) + "px";
  tip.style.top = (e.clientY - b.top - 8) + "px";
  tip.classList.add("show");
});
svg.addEventListener("pointerleave", () => tip.classList.remove("show"));
svg.addEventListener("click", e => {
  const p = e.target.closest("path.regio");
  if (!p || p.classList.contains("dim")) return;
  sel = +p.dataset.i; show(sel); mark(sel);
});
svg.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const p = e.target.closest("path.regio"); if (!p) return;
  e.preventDefault(); sel = +p.dataset.i; show(sel); mark(sel);
});
svg.addEventListener("focusin", e => {
  const p = e.target.closest("path.regio"); if (p) mark(+p.dataset.i);
});
tbody.addEventListener("click", e => {
  const tr = e.target.closest("tr.row"); if (!tr) return;
  sel = +tr.dataset.i; show(sel); mark(sel);
});
document.getElementById("legend").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const c = b.dataset.cat;
  if (active.has(c)) active.delete(c); else active.add(c);
  if (!active.size) ORDER.forEach(x => active.add(x));
  document.querySelectorAll(".chip").forEach(ch =>
    ch.setAttribute("aria-pressed", active.has(ch.dataset.cat) ? "true" : "false"));
  applyFilter();
});
</script>
</body>
</html>
